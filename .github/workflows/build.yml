name: Build APK

# Chalta hai jab bhi repo mein kuch upload/push ho (zip ya normal files)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (agar repo mein zip upload hui ho)
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Zip mili: $ZIP"
            rm -rf _proj
            mkdir -p _proj
            unzip -o -q "$ZIP" -d _proj
          else
            echo "Zip nahi mili, repo ki normal files use hongi"
          fi

      - name: Find Gradle project
        run: |
          if [ -d _proj ]; then BASE=_proj; else BASE=.; fi
          SETTINGS=$(find "$BASE" -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts nahi mili. Project files sahi upload karein."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project folder: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pakistan-Geography-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
